name: Bot de ofertas

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón para ejecutarlo a mano

permissions:
  contents: write             # necesario para guardar ofertas_vistas.json

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar ofertas y enviar a Discord
        run: python bot_ofertas.py --una-vez
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Guardar ofertas vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898741+github-actions[bot]@users.noreply.github.com"
          git add ofertas_vistas.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar ofertas vistas"
            git pull --rebase
            git push
          fi
